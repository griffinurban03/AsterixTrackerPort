<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asterisk - HTML5 Port</title>
    <style>
        body {
            background-color: #111;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* The on-screen display canvas, scaled up 3x from the 300x200 internal resolution */
        canvas {
            background-color: #000;
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            image-rendering: pixelated; /* Ensures sharp scaling */
        }
        p {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="displayCanvas" width="900" height="600"></canvas>
    <p>Hold [ENTER] to rise, Release to fall. Navigate the gap.</p>
</div>

<script>
    // --- Canvas & Rendering Setup ---
    const displayCanvas = document.getElementById('displayCanvas');
    const displayCtx = displayCanvas.getContext('2d');
    
    // Offscreen canvas for 1:1 pixel rendering and perfect collision detection
    const offscreenCanvas = document.createElement('canvas');
    offscreenCanvas.width = 300;
    offscreenCanvas.height = 200;
    const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

    // --- Game State Variables ---
    const GAME_STATES = { START: 0, PLAYING: 1, TRANSITION: 2, GAMEOVER: 3 };
    let currentState = GAME_STATES.START;
    
    let level = 1;
    let highScore = localStorage.getItem('asteriskHighScore') || 1;
    
    let px = 0;
    let py = 100;
    let driftingAsterisks = [];
    
    let isEnterDown = false;
    let keyLock = false; // Prevents holding enter from instantly restarting
    
    // Time tracking for ~50FPS fixed timestep
    let lastTime = 0;
    let accumulator = 0;
    let tickInterval = 20; // 20ms = 50 FPS

    // --- Input Handling ---
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            isEnterDown = true;
            
            if (currentState === GAME_STATES.START) {
                startGame();
            } else if (currentState === GAME_STATES.GAMEOVER && !keyLock) {
                startGame();
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') {
            isEnterDown = false;
            keyLock = false; // Unlock restart ability once key is released
        }
    });

    function getPlayerColor(currentLevel) {
        if (currentLevel < 5) return 'yellow';      // Levels 1-4: Classic Yellow
        if (currentLevel < 10) return '#39FF14';    // Levels 5-9: Neon Green
        if (currentLevel < 15) return '#00FFFF';    // Levels 10-14: Cyan
        return '#FF00FF';                           // Levels 15+: Hot Pink
    }   

    // --- Game Logic ---
    function startGame() {
        level = 1;
        tickInterval = 20; 
        loadLevel();
        currentState = GAME_STATES.PLAYING;
    }

    function loadLevel() {
        px = 0;
        py = 100; // Vertical center
        
        // Difficulty Ramp: Increase speed starting at level 5
        if (level >= 5) {
            tickInterval = Math.max(10, 20 - (level - 4)); // Reduces interval by 1ms per level, floor at 10ms
        }

        // 1. Clear offscreen canvas
        offscreenCtx.fillStyle = 'black';
        offscreenCtx.fillRect(0, 0, 300, 200);

        // 2. Draw Borders (White)
        offscreenCtx.fillStyle = 'white';
        offscreenCtx.fillRect(0, 0, 300, 1);     // Top
        offscreenCtx.fillRect(0, 199, 300, 1);   // Bottom
        
        // Calculate a random gap position.
        // Calculate the gap size: starts at 30, shrinks by 1 per level, minimum 8px.
        const gapSize = Math.max(8, 31 - level);
        
        // Calculate max gapTop to ensure the gap doesn't draw off the bottom edge
        const maxGapTop = 190 - gapSize; 
        
        // Randomize the vertical position of the gap within safe bounds
        const gapTop = Math.floor(Math.random() * (maxGapTop - 10)) + 10;
        const gapBottom = gapTop + gapSize;

        // Draw the Right edge with our dynamically sized and positioned gap
        offscreenCtx.fillRect(299, 0, 1, gapTop);                  // Top wall
        offscreenCtx.fillRect(299, gapBottom, 1, 200 - gapBottom); // Bottom wall

        // 3. Draw Asterisks
        offscreenCtx.font = 'bold 12px "Courier New"';
        offscreenCtx.textBaseline = 'top';
        const numAsterisks = level * 3;
        
        for (let i = 0; i < numAsterisks; i++) {
            // Keep away from the absolute start to give player a moment
            let ax = Math.floor(Math.random() * 250) + 30; 
            let ay = Math.floor(Math.random() * 180) + 10;
            offscreenCtx.fillText('*', ax, ay);
        }

        driftingAsterisks = [];
        const numDrifters = Math.floor(level / 2); // 1 at L2, 2 at L4, etc.
        
        for (let i = 0; i < numDrifters; i++) {
            driftingAsterisks.push({
                x: Math.floor(Math.random() * 200) + 50, // Keep away from start
                y: Math.floor(Math.random() * 180) + 10,
                vy: (Math.random() > 0.5 ? 0.5 : -0.5)   // Move up or down by 0.5px per tick
            });
        }
    }

    function updatePhysics() {
        // Player Movement
        if (isEnterDown) {
            py -= 1; // Rise
        } else {
            py += 1; // Fall
        }
        px += 1; // Advance forward

        // Check level completion BEFORE collision (survived the 299 right border)
        if (px >= 300) {
            levelComplete();
            return;
        }

        // Pixel-perfect collision detection
        const pixelData = offscreenCtx.getImageData(px, py, 1, 1).data;
        
        // FIX: Use a > 50 threshold instead of strict non-zero limits. 
        // Modern P3 color-space monitors often render "black" on canvas as [1, 1, 1] internally.
        // This threshold safely triggers on white/yellow objects while ignoring color profile noise.
        if (pixelData[0] > 50 || pixelData[1] > 50 || pixelData[2] > 50) {
            gameOver();
            return;
        }

        for (let a of driftingAsterisks) {
            a.y += a.vy;
            
            // Bounce off the top and bottom borders
            if (a.y <= 5 || a.y >= 195) a.vy *= -1;
            
            // Mathematical collision check (Bounding box)
            // If the player gets within ~5 pixels of the center of a red asterisk, CRASH!
            if (Math.abs(px - a.x) < 5 && Math.abs(py - a.y) < 5) {
                gameOver();
                return;
            }
        }

        // Draw Player Pixel to offscreen canvas (leaves a trail)
        offscreenCtx.fillStyle = getPlayerColor(level); // Dynamic color based on level
        offscreenCtx.fillRect(px, py, 1, 1);
    }

    function levelComplete() {
        currentState = GAME_STATES.TRANSITION;
        if (level > highScore) {
            highScore = level;
            localStorage.setItem('asteriskHighScore', highScore);
        }
        
        setTimeout(() => {
            level++;
            loadLevel();
            currentState = GAME_STATES.PLAYING;
        }, 1000); // 1 second pause
    }

    function gameOver() {
        currentState = GAME_STATES.GAMEOVER;
        keyLock = true; // Force player to release and repress Enter to restart
        if (level > highScore) {
            highScore = level;
            localStorage.setItem('asteriskHighScore', highScore);
        }
    }

    // --- Rendering Loop ---
    function renderDisplay() {
        // 1. Clear Display Canvas
        displayCtx.fillStyle = 'black';
        displayCtx.fillRect(0, 0, displayCanvas.width, displayCanvas.height);

        // 2. Scale and draw offscreen canvas to display canvas
        displayCtx.imageSmoothingEnabled = false; 
        displayCtx.drawImage(offscreenCanvas, 0, 0, 900, 600);

        displayCtx.save();
        displayCtx.scale(3, 3); // Scale 3x to match the internal game coordinate system
        displayCtx.font = 'bold 12px "Courier New"';
        displayCtx.textBaseline = 'middle';
        displayCtx.fillStyle = 'red';
        
        for (let a of driftingAsterisks) {
            displayCtx.fillText('*', a.x, a.y);
        }
        displayCtx.restore(); // Undo the 3x scale for the rest of the UI text

        // 3. Draw UI overlays
        displayCtx.fillStyle = 'white';
        displayCtx.font = 'bold 24px "Courier New"';
        displayCtx.textAlign = 'left';
        displayCtx.fillText(`LEVEL: ${level}`, 20, 30);
        
        displayCtx.textAlign = 'right';
        displayCtx.fillText(`HIGH SCORE: ${highScore}`, 880, 30);

        displayCtx.textAlign = 'center';
        if (currentState === GAME_STATES.START) {
            displayCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            displayCtx.fillRect(0, 0, 900, 600);
            displayCtx.fillStyle = 'white';
            displayCtx.font = 'bold 48px "Courier New"';
            displayCtx.fillText("ASTERISK", 450, 250);
            displayCtx.font = 'bold 24px "Courier New"';
            displayCtx.fillStyle = getPlayerColor(level);
            displayCtx.fillText("Press ENTER to Start", 450, 320);
        } 
        else if (currentState === GAME_STATES.GAMEOVER) {
            displayCtx.fillStyle = 'rgba(255, 0, 0, 0.3)';
            displayCtx.fillRect(0, 0, 900, 600);
            displayCtx.fillStyle = 'white';
            displayCtx.font = 'bold 48px "Courier New"';
            displayCtx.fillText("GAME OVER", 450, 280);
            displayCtx.font = 'bold 24px "Courier New"';
            displayCtx.fillText(`Died on Level ${level}`, 450, 330);
            displayCtx.fillStyle = getPlayerColor(level);
            displayCtx.fillText("Press ENTER to Restart", 450, 380);
        }
        else if (currentState === GAME_STATES.TRANSITION) {
            displayCtx.fillStyle = 'rgba(0, 255, 0, 0.2)';
            displayCtx.fillRect(0, 0, 900, 600);
            displayCtx.fillStyle = 'white';
            displayCtx.font = 'bold 48px "Courier New"';
            displayCtx.fillText(`LEVEL ${level} COMPLETE!`, 450, 300);
        }
    }

    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let delta = timestamp - lastTime;
        lastTime = timestamp;

        // FIX: Prevent "Spiral of Death". If the user switches tabs and comes back, 
        // the delta will be massive and instantly teleport the player into a border. 
        if (delta > 100) delta = tickInterval;

        if (currentState === GAME_STATES.PLAYING) {
            accumulator += delta;
            // Update physics in fixed timesteps
            while (accumulator >= tickInterval) {
                updatePhysics();
                accumulator -= tickInterval;
                // If state changes mid-tick, break out of loop
                if (currentState !== GAME_STATES.PLAYING) break; 
            }
        }

        renderDisplay();
        requestAnimationFrame(gameLoop);
    }

    // Start Loop
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
